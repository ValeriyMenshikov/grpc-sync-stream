[project]
name = "grpc-sync-stream"
version = "0.1.0"
description = "grpc.aio-style write()/read()/done_writing() for streaming calls of synchronous grpcio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Valery Menshikov", email = "team095hunter@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["grpcio>=1.49.1"]
keywords = ["grpc", "grpcio", "streaming", "bidi", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "protobuf>=4.21",
    "pytest>=8",
    "pytest-repeat>=0.9.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "types-grpcio>=1.0.0.20250318",
    "types-protobuf>=5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grpc_sync_stream"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-ra"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]
mypy_path = "examples"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "RET", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "PT012"]  # __exit__ tests raise from inside the with block
